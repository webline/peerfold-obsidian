<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Peerfold</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A33"/>
      <stop offset="1" stop-color="#14525C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="248" rx="104" fill="url(#glow)"/>
  <!-- Same geometry as the monochrome glyph in src/obsidian/icon.ts, on a 24 grid scaled up. -->
  <g transform="translate(80 72) scale(14.667)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- folder with its corner folded over: the "fold" in Peerfold -->
    <path d="M21 14.5V9a2 2 0 0 0-2-2h-8.5l-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h10.5" stroke="#E8F4F2" stroke-width="1.6"/>
    <path d="M21 14.5h-3.5a2 2 0 0 0-2 2V20z" fill="#F2A541" stroke="#F2A541" stroke-width="1.6"/>
    <!-- two peers, linked -->
    <path d="M7.5 13h5" stroke="#E8F4F2" stroke-width="1.4"/>
    <circle cx="7.5" cy="13" r="1.9" fill="#F2A541"/>
    <circle cx="12.5" cy="13" r="1.9" fill="#F2A541"/>
  </g>
</svg>
